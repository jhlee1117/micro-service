spring:
  application:
    name: api-gateway
  profiles:
    active: local
  cloud:
    gateway:
      routes:
      - id: auth-service
        uri: lb://auth-service
        predicates:
          - Path=/auth/**, /user/**, /secure/**, /role/**, /tenant/**, /oauth2/**, /login/oauth2/**, /menus/**, /module/**, /permission/**
      - id: board-service
        uri: lb://board-service
        predicates:
          - Path=/board/**
        # filters:
        #   - JwtAuthentication
server:
  port: 8070

jwt:
  secret: ${JWT_SECRET:local-dev-jwt-secret-change-before-deploy-32chars}
  access-token-expire-time: 3600000
  refresh-token-expire-time: 604800000
  secret-key-algorithm: HS256

# 보호가 필요한 API 경로 설정
# protected-paths:
#   - /user/**
#   - /admin/**
#   - /api/secure/**
#   - /internal/**

frontend:
  url: http://localhost:3000
  login-path: /auth/login
