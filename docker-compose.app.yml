services:
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_URI: http://service-discovery:8761/eureka/
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      PUBLIC_DEV_ENDPOINTS: ${PUBLIC_DEV_ENDPOINTS}
    networks:
      - microservices-network
    restart: unless-stopped

  board-service:
    build: ./board-service
    container_name: board-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_URI: http://service-discovery:8761/eureka/
      REDIS_HOST: redis
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - microservices-network
    restart: unless-stopped

  tenant-provisioning-worker:
    build: ./tenant-provisioning-worker
    container_name: tenant-provisioning-worker
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8083
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_URI: http://service-discovery:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    networks:
      - microservices-network
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8070:8070"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8070
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_URI: http://service-discovery:8761/eureka/
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    networks:
      - microservices-network
    restart: unless-stopped

networks:
  microservices-network:
    external: true
