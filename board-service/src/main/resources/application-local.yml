spring:
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # 로컬 H2 프로파일은 테넌트별 Flyway 마이그레이션 없이 기본(public) 스키마에 자동으로 테이블을 만들어
      # 빠르게 개발/구동할 수 있게 한다. 실제 테넌트 스키마 분리 검증은 docker(Postgres) 프로파일로 수행한다.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
