spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # EntityManager 충돌 방지를 위한 설정
        # entitymanager_factory_interface: jakarta.persistence.EntityManagerFactory
        # 추가 안정성 설정
        jdbc:
          time_zone: UTC
        connection:
          provider_disables_autocommit: true
        # 디버깅 모드에서 발생하는 문제 해결
        generate_statistics: false
        use_sql_comments: true
  sql:
    init:
      encoding: UTF-8
      mode: always
      schema-locations:
      - classpath:sql/schema/tenant-schema.sql
      - classpath:sql/schema/user-schema.sql
      - classpath:sql/schema/role-schema.sql  # user 테이블 생성 후에 실행
      - classpath:sql/schema/modules-schema.sql
      data-locations:
      - classpath:sql/data/tenant-data.sql
      - classpath:sql/data/user-data.sql
      - classpath:sql/data/modules-data.sql
      - classpath:sql/data/menus-data.sql
      
app:
  cookie:
    domain: localhost
    secure: false