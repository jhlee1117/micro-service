spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      encoding: UTF-8
      mode: always
      schema-locations:
      - classpath:tenant-schema.sql
      - classpath:user-schema.sql
      - classpath:role-schema.sql  # user 테이블 생성 후에 실행
      - classpath:modules-schema.sql
      data-locations:
      - classpath:tenant-data.sql
      - classpath:user-data.sql
      
app:
  cookie:
    domain: localhost
    secure: false