spring:
  application:
    name: auth-service
  profiles:
    active: local
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /v3/api-docs
    configUrl: /v3/api-docs/swagger-config

jwt:
  secret: ${JWT_SECRET:local-dev-jwt-secret-change-before-deploy-32chars}
  expiration: 3600000
  refresh-expiration: 604800000

rate-limit:
  login:
    max-attempts: 5
    window-minutes: 15
    block-duration-minutes: 30

frontend:
  url: http://localhost:3000
  oauth2:
    success-path: /oauth2/success
    signup-path: /oauth2/signup
    failure-path: /oauth2/error

app:
  oauth2:
    id-token-clock-skew: 300s
    signup-token-ttl: 15m
