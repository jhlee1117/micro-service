spring:
  application:
    name: auth-service
  profiles:
    active: local
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /v3/api-docs
    configUrl: /v3/api-docs/swagger-config

jwt:
  secret: override-from-config-server
  expiration: 3600000
  refresh-expiration: 604800000

rate-limit:
  login:
    max-attempts: 5
    window-minutes: 15
    block-duration-minutes: 30

frontend:
  url: http://localhost:3000
  oauth2:
    success-path: /oauth2/success
    signup-path: /auth/signup
    failure-path: /oauth2/error

app:
  oauth2:
    id-token-clock-skew: 300s
