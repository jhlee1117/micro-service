buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
	id 'org.springframework.boot' version '3.4.5' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
	id 'com.diffplug.spotless' version '8.9.0' apply false
}

allprojects {
    group = 'com.microservices'
    version = '1.0.0'
    repositories {
        mavenCentral()
    }
}

ext {
    archUnitVersion = '1.4.2'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'checkstyle'
    apply plugin: 'com.diffplug.spotless'
    
    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    checkstyle {
        toolVersion = '10.21.4'
        config = resources.text.fromFile(rootProject.file('config/checkstyle/google_checks.xml'))
        configProperties = [
                'org.checkstyle.google.suppressionfilter.config':
                        rootProject.file('config/checkstyle/suppressions.xml').absolutePath
        ]
        ignoreFailures = false
        maxWarnings = 0
    }

    tasks.withType(Checkstyle).configureEach {
        reports {
            xml.required = true
            html.required = true
        }
    }

    spotless {
        java {
            target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
            googleJavaFormat('1.28.0').formatJavadoc(false)
            removeUnusedImports()
            formatAnnotations()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    tasks.named('checkstyleMain') {
        source = fileTree("${projectDir}/src/main/java") {
            include '**/*.java'
        }
    }

    tasks.named('checkstyleTest') {
        source = fileTree("${projectDir}/src/test/java") {
            include '**/*.java'
        }
    }

    // common-jwt를 제외한 다른 모듈들에만 Spring 의존성 적용
    if (!name.startsWith('common-')) {
        apply plugin: 'io.spring.dependency-management'
        dependencies {
            testImplementation 'org.springframework.boot:spring-boot-starter-test'
        }
    }

    dependencies {
        testImplementation "com.tngtech.archunit:archunit-junit5:${rootProject.ext.archUnitVersion}"
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

// 공통 설정 (모든 프로젝트에 적용)
configure(allprojects) {
    apply plugin: 'java'
    
    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

// 서비스 모듈들에만 Spring Boot 플러그인 적용
configure(subprojects.findAll { it.name.contains('-service') || it.name.contains('-gateway') || it.name.contains('discovery') }) {
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    
    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }
}
