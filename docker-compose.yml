version: "3.8"

services:
  service-discovery:
    image: service-discovery:latest
    ports:
      - "8761:8761"
    networks:
      - microservices-network
    environment:
      - EUREKA_SERVER_PORT=8761
      - EUREKA_SERVER_DEFAULT_ZONE=http://localhost:8761/eureka
      - SPRING_PROFILES_ACTIVE=docker
    restart: unless-stopped

networks:
  microservices-network:
    driver: bridge
    